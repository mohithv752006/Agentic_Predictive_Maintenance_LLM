# Central configuration. Values of the form ${VAR} or ${VAR:default} are read from
# the environment (.env locally, Colab Secrets in Colab). Relative paths are resolved
# against the project base directory (server/ locally, Google Drive in Colab).

env: auto                     # auto | local | colab
colab_base_dir: /content/drive/MyDrive/drive-failure-agents

paths:
  raw: data/raw
  parquet: data/parquet
  artifacts: outputs/artifacts
  reports: outputs/reports
  runtime: outputs/runtime    # settings.json, checkpoints.sqlite, feedback.sqlite
  knowledge_base: knowledge_base

logging:
  level: ${LOG_LEVEL:INFO}
  json: false

data:
  source: backblaze           # backblaze | huggingface
  drive_stats_page: https://www.backblaze.com/cloud-storage/resources/hard-drive-test-data
  huggingface_dataset: backblaze/Drive_Stats   # mirror; only covers up to 2023 Q2
  download_workers: 4         # quarters downloaded in parallel
  years: [2024, 2025]
  drive_models: auto          # auto = computed from data, or an explicit list of model names
  top_k_models: 4             # models used for training
  holdout_models: 1           # extra models (next by failures) kept entirely unseen for testing
  min_failures_per_model: 30
  window_days: 30
  min_window_obs: 10          # minimum daily snapshots inside a window to emit a sample
  neg_pos_ratio: 20           # training negatives per positive (training split only)
  negative_stride_days: 7     # candidate as-of spacing for negatives
  eval_max_windows: 400000    # uniform (natural-distribution) cap per evaluation split
  split:
    serial_fractions: {train: 0.6, val: 0.2, test: 0.2}
    time_fractions: {train: 0.6, val: 0.2, test: 0.2}
  duckdb_memory_limit: 6GB
  duckdb_threads: 8
  smart_attributes: [1, 3, 4, 5, 7, 9, 10, 12, 184, 187, 188, 190, 192, 193, 194, 197, 198, 199, 240, 241, 242]
  smart_value_types: [raw, normalized]

horizons: [7, 14, 30]

llm:
  base_url: ${LLM_BASE_URL:}
  api_key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:Qwen/Qwen3.5-4B}
  temperature: 0.1
  max_tokens: 800
  timeout_s: 300             # a single-GPU fallback answers requests one at a time
  max_retries: 1
  enable_thinking: false
  health_timeout_s: 10

embeddings:
  model: BAAI/bge-small-en-v1.5
  device: cpu

rag:
  case_top_k: 5
  same_model_only: true
  knowledge_top_k: 3
  case_index_max_negatives: 50000   # cap on non-failed training trajectories in case memory

models:
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 40
    num_threads: 8
  sequence:
    kind: cnn                 # cnn | lstm
    hidden: 64
    epochs: 15
    batch_size: 256
    learning_rate: 0.001
    patience: 3
    max_windows: 150000       # cap on train/val windows materialized as tensors (RAM)
  calibration:
    method: isotonic          # isotonic | platt
  fusion:
    method: stacking          # stacking | log_odds | majority_vote

decision:
  cost_ratios: [10, 50, 200]
  default_cost_ratio: 50
  escalate_if_uncertainty_above: 0.35
  escalate_if_agent_disagreement_above: 0.4
  fixed_threshold: 0.5        # used when use_cost_policy is false

drift:
  psi_warn: 0.1
  psi_alert: 0.25
  bins: 10
  recalibration_window_days: 60
  sample_drives: 200           # drives sampled per (model, date) for on-demand drift reports
  min_family_weight: 0.1       # drift only escalates/recalibrates for families with this fusion weight

evaluation:
  llm_sample_size: 500
  llm_sample_max_positives: 150
  bootstrap_samples: 1000
  far_levels: [0.01, 0.05]
  coverage_levels: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  ece_bins: 10
  llm_concurrency: 4          # parallel graph runs on the LLM sample (vLLM batches them)

api:
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  page_size: 50

features:
  use_rag: true
  use_case_retrieval: true
  use_knowledge_retrieval: true
  use_calibration: true
  use_cost_policy: true
  use_drift: true
  use_planner: true

seeds: [0, 1, 2]
