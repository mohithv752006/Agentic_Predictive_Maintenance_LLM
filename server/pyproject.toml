[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm_agents"
version = "0.1.0"
description = "Cost-aware multi-agent RAG for hard drive failure prediction (Backblaze Drive Stats)."
requires-python = ">=3.11"
# Pinned to the versions verified in this repo. Keep in sync with requirements.txt.
# torch is installed from the CPU wheel index: see README.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "duckdb==2.0.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "lightgbm==4.7.0",
    "torch==2.14.1",
    "faiss-cpu==1.15.1",
    "sentence-transformers==6.2.0",
    "transformers==5.20.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
    "openai==3.37.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sse-starlette==3.5.1",
    "httpx==0.28.1",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdm_agents = ["llm/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live_llm: requires a reachable LLM endpoint (LLM_BASE_URL set)",
    "slow: slower tests (training on fixture data)",
]
filterwarnings = ["ignore::DeprecationWarning"]
